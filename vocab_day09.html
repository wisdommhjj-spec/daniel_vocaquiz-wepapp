<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중등 어휘 실력 진단</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#273449;background:#f4f6fa}body{margin:0}main{max-width:790px;margin:auto;padding:24px 16px 70px}header{background:#263a59;color:white;padding:27px;border-radius:20px}h1{margin:4px 0 10px;font-size:27px}h2{font-size:21px}.muted{color:#66748a}.panel{background:white;border-radius:18px;padding:24px;margin-top:18px;box-shadow:0 3px 18px #182b4610}.pill{display:inline-block;background:#e6edf9;border-radius:50px;padding:7px 13px;font-size:13px;color:#304c7b}button{border:0;border-radius:11px;padding:13px 17px;background:#365c9b;color:white;font-size:15px;cursor:pointer}button.secondary{background:#e8edf5;color:#263a59}button:disabled{opacity:.45}input,textarea{font:inherit;border:1px solid #cbd3df;border-radius:10px;padding:12px;box-sizing:border-box;width:100%}.choices{display:grid;gap:10px;margin:20px 0}.choice{border:1px solid #d4dce8;background:#fff;color:#29374e;text-align:left}.choice.selected{border:2px solid #365c9b;background:#eaf1fd}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden{display:none}.progress{height:8px;background:#e4eaf3;border-radius:20px;overflow:hidden;margin-top:15px}.bar{height:100%;background:#78a2e3;transition:width .2s}.correct{color:#176e4d}.wrong{color:#b33e3e}.review{border-top:1px solid #e3e8f0;padding:17px 0}small{line-height:1.6}</style><main><header><span style="opacity:.8">국어 어휘력 진단 · 중학교 1학년</span><h1>하루 20문항, 어휘 실력 확인</h1><div id="sub">9일차 · 소설·극·수필(6) · 15개 어휘</div></header><section id="setup" class="panel"><h2>시험 시작하기</h2><p class="muted">객관식 15문항 + 직접 입력 5문항 · 100점 만점</p><label>학습자 이름 (선택)<input id="student" placeholder="이름 입력"></label><p><span class="pill">중상 난이도</span> <span class="pill">모든 어휘 출제</span> <span class="pill">오답 복습</span></p><button onclick="start()">시험 시작</button><hr style="border:0;border-top:1px solid #eee;margin:25px 0"><h2>다른 회차 불러오기</h2><p class="muted">스킬로 만든 문제 JSON 파일을 불러오면 같은 앱에서 새 회차를 시험 볼 수 있습니다.</p><input type="file" id="upload" accept=".json,application/json"><p><button class="secondary" onclick="downloadBank()">현재 9일차 문제은행 저장</button></p></section><section id="quiz" class="panel hidden"><div class="flex" style="justify-content:space-between"><span id="count"></span><span id="answered"></span></div><div class="progress"><div id="bar" class="bar"></div></div><p id="kind" class="pill"></p><h2 id="question"></h2><div id="answers"></div><div class="flex" style="justify-content:space-between"><button class="secondary" onclick="move(-1)">이전 문제</button><button id="next" onclick="move(1)">다음 문제</button></div></section><section id="result" class="panel hidden"><h2>시험 결과</h2><h1 id="score"></h1><p id="summary"></p><div class="flex"><button onclick="showReview(false)">전체 해설</button><button class="secondary" onclick="showReview(true)">오답만 보기</button><button class="secondary" onclick="retry()">오답 재시험</button><button class="secondary" onclick="restart()">처음으로</button><button class="secondary" onclick="exportResult()">결과 저장</button></div><div id="reviews"></div></section></main><script>
let bank={day:9,unit:'소설·극·수필(6)',words:['입체적 구성','자초지종','장면의 전환','적이','전기성','제수하다','제약','종적','주관적','중수필','지시문','지중하다','진솔하다','쪽빛','쭈뼛거리다'],questions:[
['입체적 구성','사건의 시간적 순서를 바꾸어 과거와 현재를 교차시키는 구성 방식은?',['입체적 구성','평면적 구성','순행적 구성','단일 구성'],0,'시간의 흐름을 그대로 따르지 않고 회상·역전 등을 활용한다.'],
['자초지종','일의 시작부터 끝까지의 과정을 뜻하는 말은?',['전말의 일부','자초지종','장면의 전환','제약'],1,'자초지종은 처음부터 끝까지의 사정이다.'],
['장면의 전환','연극에서 무대 배경이 바뀌거나 시간·장소가 달라지는 것을 무엇이라 하는가?',['장면의 전환','종적','지시문','입체적 구성'],0,'장면의 전환은 무대나 극의 시공간 변화를 가리킨다.'],
['적이','“그의 설명은 적이 설득력이 있었다.”의 ‘적이’와 가장 가까운 뜻은?',['아주 조금도','꽤, 다소','전혀','극도로'],1,'적이는 꽤, 다소라는 뜻이다.'],
['전기성','평범한 현실에서 쉽게 일어나지 않을 법한 신기한 사건의 성격은?',['주관성','전기성','진솔성','객관성'],1,'전기성은 비현실적이고 신기한 사건의 성격이다.'],
['제수하다','“그를 새 직책에 제수하였다.”의 뜻으로 알맞은 것은?',['자리에서 물러나게 했다','관직이나 직책을 내려 주었다','행동을 금지했다','소식을 전했다'],1,'제수하다는 관직 등을 내려 준다는 뜻이다.'],
['제약','“예산의 제약으로 계획을 축소했다.”에서 제약은?',['조건을 붙여 제한함','자유롭게 선택함','원인을 밝힘','기회를 늘림'],0,'제약은 조건을 붙여 제한하거나 제한하는 조건이다.'],
['종적','“범인의 종적이 묘연하다.”에서 종적의 뜻은?',['논리적인 주장','행방이나 자취','깊은 생각','거친 행동'],1,'종적은 행방이나 남긴 자취를 뜻한다.'],
['주관적','개인의 생각·감정을 기준으로 판단하는 태도를 무엇이라 하는가?',['객관적','중립적','주관적','체계적'],2,'주관적은 자기 생각이나 감정을 기준으로 한다.'],
['중수필','사회적 문제를 논리적·체계적으로 다루는 수필은?',['경수필','중수필','기행문','전기문'],1,'중수필은 비교적 무겁고 논리적인 내용을 다룬다.'],
['지시문','희곡에서 등장인물의 동작, 표정, 무대 상황을 설명하는 부분은?',['대사','지시문','해설자의 독백','주제문'],1,'지시문은 행동·표정·무대 상황 등을 지시한다.'],
['지중하다','“그의 책임은 지중하다.”의 의미는?',['매우 가볍다','더할 수 없이 귀중하거나 무겁다','뜻이 모호하다','거짓이 없다'],1,'지중하다는 더할 수 없이 귀중하거나 무겁다는 뜻이다.'],
['진솔하다','꾸밈이나 거짓 없이 참되고 솔직한 태도는?',['진솔하다','주관적이다','적이하다','쭈뼛거리다'],0,'진솔하다는 거짓 없이 참되고 솔직하다는 뜻이다.'],
['쪽빛','쪽빛과 가장 가까운 색은?',['짙은 푸른빛','연한 분홍빛','밝은 노란빛','짙은 붉은빛'],0,'쪽빛은 짙은 푸른빛이다.'],
['쭈뼛거리다','“낯선 사람들 앞에서 쭈뼛거렸다.”의 뜻으로 알맞은 것은?',['자신 있게 나섰다','무섭거나 낯설어 머뭇거렸다','계속 웃었다','매우 빨리 움직였다'],1,'쭈뼛거리다는 주저하거나 머뭇거리는 행동이다.'],
['입체적 구성','회상 장면이 현재 사건 사이에 끼어드는 구성을 쓰시오.',null,'입체적 구성','시간의 순서를 바꾸는 구성 방식이다.'],
['중수필','개인의 가벼운 일상보다 사회적 문제를 체계적으로 분석하는 수필의 종류를 쓰시오.',null,'중수필','중수필은 무게 있는 소재와 논리적 전개가 특징이다.'],
['지시문','희곡에서 “(고개를 숙이며 천천히 퇴장한다.)”는 무엇인가?',null,'지시문','괄호 안 동작·행동 안내는 지시문이다.'],
['진솔하다','“그는 잘못을 숨기지 않고 ______ 고백했다.” 빈칸에 들어갈 말을 기본형으로 쓰시오.',null,'진솔하다','진솔하게 고백했다 → 기본형 진솔하다.'],
['자초지종','“무슨 일이 있었는지 ______을/를 설명해 봐.” 빈칸에 알맞은 어휘를 쓰시오.',null,'자초지종','사건의 처음부터 끝까지의 사정을 뜻한다.']
]};let qs=[],responses=[],idx=0,wrong=[];const $=id=>document.getElementById(id);function start(subset){qs=(subset||bank.questions).map(x=>x);responses=Array(qs.length).fill('');idx=0;['setup','result'].forEach(x=>$(x).classList.add('hidden'));$('quiz').classList.remove('hidden');render()}function render(){let q=qs[idx];$('count').textContent=`${idx+1} / ${qs.length}문항`;$('answered').textContent=`응답 ${responses.filter(x=>x!=='').length}개`;$('bar').style.width=((idx+1)/qs.length*100)+'%';$('kind').textContent=q[2]?'객관식 · 5점':'직접 입력 · 5점';$('question').textContent=q[1];$('answers').innerHTML='';if(q[2]){let d=document.createElement('div');d.className='choices';q[2].forEach((opt,i)=>{let b=document.createElement('button');b.className='choice'+(responses[idx]===String(i)?' selected':'');b.textContent=`${i+1}. ${opt}`;b.onclick=()=>{responses[idx]=String(i);render()};d.append(b)});$('answers').append(d)}else{let inp=document.createElement('input');inp.placeholder='정답을 입력하세요';inp.value=responses[idx];inp.oninput=e=>{responses[idx]=e.target.value;$('answered').textContent=`응답 ${responses.filter(x=>x!=='').length}개`};$('answers').append(inp)}$('next').textContent=idx===qs.length-1?'채점하기':'다음 문제'}function move(n){if(n===1&&idx===qs.length-1){finish();return}idx=Math.max(0,Math.min(qs.length-1,idx+n));render()}function norm(s){return String(s).replace(/[\s.,!?]/g,'').trim()}function isCorrect(q,a){return q[2]?a===String(q[3]):norm(a)===norm(q[3])}function finish(){let missing=responses.filter(x=>x==='').length;if(missing&&!confirm(`미응답 ${missing}문항이 있습니다. 제출할까요?`))return;wrong=qs.map((q,i)=>({q,a:responses[i],ok:isCorrect(q,responses[i])})).filter(x=>!x.ok);let pts=(qs.length-wrong.length)*5;$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`${pts}점 / ${qs.length*5}점`;$('summary').textContent=`정답 ${qs.length-wrong.length}개 · 오답 ${wrong.length}개 · 정답률 ${Math.round((qs.length-wrong.length)/qs.length*100)}%`;showReview(true)}function showReview(onlyWrong){$('reviews').innerHTML='';qs.forEach((q,i)=>{let ok=isCorrect(q,responses[i]);if(onlyWrong&&ok)return;let d=document.createElement('div');d.className='review';let answer=q[2]?q[2][q[3]]:q[3],given=q[2]?(responses[i]===''?'미응답':q[2][Number(responses[i])]):responses[i]||'미응답';d.innerHTML=`<b class="${ok?'correct':'wrong'}">${i+1}. ${ok?'정답':'오답'} · ${q[0]}</b><p></p><small>내 답: <b></b><br>정답: <strong></strong><br><span></span></small>`;d.querySelector('p').textContent=q[1];d.querySelector('small b').textContent=given;d.querySelector('strong').textContent=answer;d.querySelector('span').textContent=q[4];$('reviews').append(d)})}function retry(){if(!wrong.length){alert('오답이 없습니다!');return}start(wrong.map(x=>x.q))}function restart(){['quiz','result'].forEach(x=>$(x).classList.add('hidden'));$('setup').classList.remove('hidden')}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadBank(){download('day09_vocab.json',JSON.stringify(bank,null,2),'application/json')}function exportResult(){let data={student:$('student').value,day:bank.day,date:new Date().toISOString(),total:qs.length,correct:qs.length-wrong.length,details:qs.map((q,i)=>({word:q[0],question:q[1],response:responses[i],correct:isCorrect(q,responses[i])}))};download('vocab_result_day'+bank.day+'.json',JSON.stringify(data,null,2),'application/json')}$('upload').onchange=async e=>{try{let b=JSON.parse(await e.target.files[0].text());if(!Array.isArray(b.words)||!Array.isArray(b.questions)||!b.questions.length||b.questions.some(q=>!Array.isArray(q)||q.length<5||typeof q[1]!=='string'||(q[2]&&(!Array.isArray(q[2])||!Number.isInteger(q[3])||q[3]<0||q[3]>=q[2].length))))throw Error('형식 오류');bank=b;$('sub').textContent=`${bank.day}일차 · ${bank.unit||'어휘'} · ${bank.words.length}개 어휘`;alert('새 회차를 불러왔습니다.')}catch(err){alert('문제 파일을 확인해 주세요: '+err.message)}};
</script></html>
